<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص مزامنة مدرستي — Firebase</title>
<style>
body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#0b1526;color:#eaf2ff;margin:0;padding:18px}
h1{font-size:20px;text-align:center}
.card{background:#12203a;border:2px solid #22406b;border-radius:16px;padding:14px;margin:12px auto;max-width:640px}
.ok{border-color:#0e7490;background:#062e33}
.bad{border-color:#b91c1c;background:#3a0d0d}
.b{font-weight:900;font-size:15px}
.s{opacity:.9;font-size:12px;margin-top:6px;line-height:1.9;word-break:break-all}
button{background:#0e7490;border:none;color:#fff;border-radius:10px;padding:10px 22px;font-weight:900;font-size:14px}
</style>
</head>
<body>
<h1>🏫 فحص السحابة — نظام مدرستي</h1>
<div class="card"><div class="b">🔄 تحديث الفحص</div><div class="s">تقرأ الصفحة قاعدة Firebase مباشرة وتعرض حالة بياناتك بالألوان.</div><br><button onclick="run()">🔄 تحديث الآن</button></div>
<div id="out"></div>
<script>
var KEY='AIzaSyDnkimOLyaxO7gn4aO9hZPrKAlMzwSx4R8';
var BASE='https://firestore.googleapis.com/v1/projects/madrasaty-fc7d1/databases/%28default%29/documents';
function sv(f){ return (f&&f.stringValue!==undefined)?f.stringValue:''; }
function card(title,ok,lines){ return '<div class="card '+(ok?'ok':'bad')+'"><div class="b">'+(ok?'✅ ':'❌ ')+title+'</div><div class="s">'+lines.join('<br>')+'</div></div>'; }
function run(){
  var out=document.getElementById('out'); out.innerHTML='<div class="card"><div class="b">⏳ جارٍ الفحص…</div></div>';
  var h='';
  try{
    var st=JSON.parse(localStorage.getItem('nb60_status')||'null');
    var mode=localStorage.getItem('nb44_mode')||'(غير محدد)';
    h+=card('حالة المزامنة على هذا المتصفح', !!(st&&st.ok), [
      '• وضع الجهاز: '+mode,
      st?('• آخر رفع: '+(st.ok?'ناجح':'فاشل')+' — '+new Date(st.ts).toLocaleString()+' ('+(st.okc||'')+'/'+(st.total||'')+' وثيقة)'):'• لم يُسجَّل رفع من هذا المتصفح بعد'
    ]);
  }catch(e){}
  fetch(BASE+'/schools?key='+KEY).then(function(r){return r.json();}).then(function(list){
    var docs=(list&&list.documents)||[];
    var best='',sid=null,name='';
    docs.forEach(function(d){ var f=d.fields||{}; var up=sv(f.updated_at); if(up>=best){ best=up; sid=(d.name||'').split('/').pop(); name=sv(f.name)||sid; } });
    h+=card('المدارس المرفوعة إلى Firebase: '+docs.length, docs.length>0, docs.slice(0,6).map(function(d){ var f=d.fields||{}; return '• '+sv(f.name)+' — آخر تحديث: '+sv(f.updated_at); }));
    if(!sid){ out.innerHTML=h+card('لقطة البيانات',false,['لا توجد لقطة بعد — افتح التطبيق وسجّل الدخول ثم حدّث هنا.']); return; }
    fetch(BASE+'/schools/'+encodeURIComponent(sid)+'/snapshot/data?key='+KEY).then(function(r){return r.json();}).then(function(sn){
      var data=sv(sn&&sn.fields&&sn.fields.data);
      if(!data){ out.innerHTML=h+card('لقطة مدرسة '+name,false,['توجد مدرسة لكن بلا لقطة بيانات.']); return; }
      var dbj=JSON.parse(data);
      var stu=0; try{ Object.keys(dbj.students||{}).forEach(function(k){ stu+=(dbj.students[k]||[]).length; }); }catch(e){}
      var tm=(dbj.settings&&dbj.settings.tasksModule)||{};
      var tsk=(tm.tasks||[]).length, ntf=(tm.notifs||[]).length, stf=(dbj.staff||[]).length;
      out.innerHTML=h+card('لقطة مدرسة «'+name+'»',true,[
        '• الطلاب: '+stu+' • الكادر: '+stf,
        '• المهام: '+tsk+' • الإشعارات: '+ntf,
        '• آخر تحديث: '+best,
        ' بياناتك سحابية حقيقية وتعمل!'
      ]);
    }).catch(function(e){ out.innerHTML=h+card('خطأ بقراءة اللقطة',false,[String(e)]); });
  }).catch(function(e){ out.innerHTML=card('خطأ بالاتصال',false,[String(e)]); });
}
run();
</script>
</body>
</html>
